# GitHub Action for a PROJECT repo: tells your portfolio to rebuild when you push here,
# so the portfolio page updates within minutes instead of at the next daily run.
#
# Setup (once per project repo):
#   1. Copy this file to .github/workflows/ping-portfolio.yml
#   2. Change PORTFOLIO_REPO below to your portfolio repo ("you/portfolio")
#   3. Add a secret PORTFOLIO_TOKEN: a fine-grained token with access to the portfolio
#      repo only, permission "Contents: read and write" (needed to trigger its workflow)

name: Ping portfolio

on:
  push:
    branches: [main]

env:
  PORTFOLIO_REPO: YOUR_USERNAME/portfolio

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the portfolio to rebuild
        env:
          TOKEN: ${{ secrets.PORTFOLIO_TOKEN }}
        run: |
          curl --fail -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$PORTFOLIO_REPO/dispatches" \
            -d '{"event_type": "project-pushed"}'
